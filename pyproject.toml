[project]
name = "nba-analytics"
version = "0.1.0"
description = "NBA player projections, defensive value, and game outcome models"
authors = [
    { name = "AaronBarel", email = "abarel18@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "adjusttext>=1.4.0",
    "beautifulsoup4>=4.15.0",
    "html5lib>=1.1",
    "kaleido>=1.5.0",
    "lxml>=6.1.3",
    "matplotlib>=3.11.2",
    "nbformat>=5.11.1",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pyarrow>=26.0.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "nbconvert>=7.17.2",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
src = ["src"]
